[package]
name = "maycord-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The injectable agent dylib: a thin platform entry point that hands off to maycord-loader's agent once forced into a target."

[lib]
crate-type = ["cdylib"]

[dependencies]
