[package]
name = "maycord-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The authorized-target loader: identity-gated launch and palette-write planning for patching a verified GPUI build. The one maycord crate allowed to use unsafe."

[dependencies]
maycord-target.workspace = true
maycord-theme.workspace = true

# This crate is the deliberate exception to the workspace-wide `unsafe_code =
# forbid`: the in-process agent must write a live register/memory slot. It opts
# out of the workspace lint set and allows unsafe locally, keeping that boundary
# visible and contained to this one crate.
[lints.rust]
unsafe_code = "allow"
