[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["maycord contributors"]
rust-version = "1.82"

[workspace.dependencies]
maycord-manifest = { path = "crates/maycord-manifest" }
maycord-theme = { path = "crates/maycord-theme" }
maycord-host = { path = "crates/maycord-host" }
maycord-target = { path = "crates/maycord-target" }
maycord-loader = { path = "crates/maycord-loader" }
maycord-agent = { path = "crates/maycord-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[workspace.lints.rust]
# v1 is a pure, safe runtime. The authorized-target loader lands in its own crate
# that opts back in locally; keeping the default at `forbid` keeps that boundary visible.
unsafe_code = "forbid"
