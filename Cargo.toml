[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["fpui contributors"]
rust-version = "1.82"

[workspace.dependencies]
fpui-manifest = { path = "crates/fpui-manifest" }
fpui-theme = { path = "crates/fpui-theme" }
fpui-host = { path = "crates/fpui-host" }
fpui-target = { path = "crates/fpui-target" }
fpui-loader = { path = "crates/fpui-loader" }
fpui-monitor = { path = "crates/fpui-monitor" }
fpui-agent = { path = "crates/fpui-agent" }
fpui-wasm = { path = "crates/fpui-wasm" }
fpui-plugin-sdk = { path = "crates/fpui-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
object = "0.36"

[workspace.lints.rust]
# v1 is a pure, safe runtime. The authorized-target loader lands in its own crate
# that opts back in locally; keeping the default at `forbid` keeps that boundary visible.
unsafe_code = "forbid"
